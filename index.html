    :root {
      --background: #f4f7fb;
      --surface: #ffffff;
      --text: #213047;
      --muted: #65758b;
      --blue: #286b9b;
      --navy: #12243a;
      --line: #dfe7f0;
      --accent: #a5dcff;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:

        "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.75;
    }

    a {
      color: var(--blue);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid #54b4ee;
      outline-offset: 5px;
    }

    .container {
      width: min(1120px, calc(100% - 48px));
      margin-inline: auto;
    }

    header {
      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(65, 145, 200, 0.25),
          transparent 45%
        ),
        linear-gradient(125deg, #101e31, #1d4263);
      color: white;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-block: 24px;
    }

    .brand {
      color: white;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .language-switch {
      display: flex;
      gap: 6px;
    }

    .language-switch button {
      min-height: 38px;
      padding: 6px 13px;
      border: 1px solid #6d859d;
      border-radius: 7px;
      background: transparent;
      color: #e2edf7;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .language-switch button.active {
      background: white;
      border-color: white;
      color: var(--navy);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      padding-block: 12px;
    }

    nav a {
      color: #d9e7f2;
      font-size: 14px;
      text-decoration: none;
    }

    nav a:hover {
      color: white;
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    .hero {
      padding: 65px 0 75px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(48px, 8vw, 82px);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .hero-role {
      margin: 12px 0;
      color: var(--accent);
      font-size: clamp(23px, 4vw, 34px);
      font-weight: 500;
      line-height: 1.35;
    }

    .hero-tagline {
      margin-top: 20px;
      font-weight: 600;
    }

    .hero-intro {
      max-width: 850px;
      color: #dce8f3;
      font-size: 17px;
    }

    .hero-location {
      margin-top: 24px;
      color: #bed0e0;
      font-size: 14px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid #7895ae;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .button.primary {
      background: white;
      border-color: white;
      color: var(--navy);
    }

    .button:hover {
      transform: translateY(-1px);
    }

    main {
      padding-bottom: 65px;
    }

    section {
      padding-top: 55px;
      scroll-margin-top: 25px;
    }

    .section-heading {
      margin-bottom: 22px;
    }

    .section-heading h2 {
      margin: 0 0 8px;
      color: #183b5a;
      font-size: clamp(25px, 4vw, 31px);
      line-height: 1.35;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
    }

    .panel,
    .experience-card,
    .education-card {
      padding: 27px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 6px 24px rgba(20, 43, 70, 0.035);
    }

    .panel > :first-child {
      margin-top: 0;
    }

    .panel > :last-child {
      margin-bottom: 0;
    }

    .experience-list,
    .education-list {
      display: grid;
      gap: 18px;
    }

    .experience-card,
    .education-card {
      border-left: 4px solid #4b91bd;
    }

    .date {
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }

    h3 {
      margin: 7px 0 6px;
      color: #204768;
      font-size: 20px;
      line-height: 1.4;
    }

    .organization {
      margin: 0 0 14px;
      color: var(--muted);
      font-weight: 600;
    }

    ul {
      margin: 12px 0 0;
      padding-left: 21px;
    }

    li {
      margin-block: 8px;
    }

    li::marker {
      color: #4b91bd;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .project-number {
      display: block;
      margin-bottom: 13px;
      color: #528ab1;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .project-card p {
      color: var(--muted);
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;

      padding: 5px 11px;
      border-radius: 7px;
      background: #edf4f9;
      color: #315a78;
      font-size: 13px;
    }

    .language-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .language-card strong {
      display: block;
      margin-bottom: 5px;
      color: #204768;
      font-size: 19px;
    }

    .language-card span {
      color: var(--muted);
    }

    .contact-panel {
      background: var(--navy);
      border-color: var(--navy);
      color: #dce8f3;
    }

    .contact-panel h2 {
      margin-top: 0;
      color: white;
      font-size: 28px;
    }

    .contact-note {
      color: #a9c5dc;
      font-size: 14px;
    }

    footer {
      padding: 25px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .container {
        width: calc(100% - 32px);
      }

      .topbar {
        gap: 12px;
      }

      .brand {
        font-size: 14px;
      }

      .language-switch button {
        padding-inline: 10px;
      }

      nav {
        gap: 10px 16px;
      }

      nav a {
        font-size: 13px;
      }

      .hero {
        padding-block: 42px 52px;
      }

      .hero-intro {
        font-size: 16px;
      }

      .grid,
      .language-grid {
        grid-template-columns: 1fr;
      }

      section {
        padding-top: 38px;
      }

      .panel,
      .experience-card,
      .education-card {
        padding: 21px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .button:hover {
        transform: none;
      }
    }

    @media print {
      body {
        background: white;
        font-size: 11pt;
      }

      header,
      .contact-panel {
        background: white;
        color: #213047;
      }

      .hero-role,
      .hero-intro,
      .hero-location,
      .eyebrow,
      .contact-panel h2,
      .contact-note {
        color: #213047;

      .language-switch,
      nav,
      .hero-actions {
        display: none;
      }

      .hero {
        padding-block: 15px;
      }

      h1 {
        font-size: 36pt;
      }

      section {
        padding-top: 22px;
      }

      .panel,
      .experience-card,
      .education-card {
        box-shadow: none;
        break-inside: avoid;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    const getElement = (id) => document.getElementById(id);

    function createElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }

    function renderNavigation(items) {
      const navigation = getElement("navigation");
      navigation.replaceChildren();

      items.forEach(([target, label]) => {
        const link = createElement("a", "", label);
        link.href = "#" + target;
        navigation.appendChild(link);
      });
    }

    function renderAbout(paragraphs) {
      const container = getElement("aboutContent");
      container.replaceChildren();

      paragraphs.forEach((text) => {
        container.appendChild(createElement("p", "", text));
      });
    }

    function renderExperience(jobs) {
      const container = getElement("experienceContent");
      container.replaceChildren();

      jobs.forEach((job) => {
        const article = createElement("article", "experience-card");

        article.append(
          createElement("div", "date", job.date),
          createElement("h3", "", job.title),
          createElement("p", "organization", job.organization)
        );

        const list = createElement("ul");

        job.points.forEach((point) => {
          list.appendChild(createElement("li", "", point));
        });

        article.appendChild(list);
        container.appendChild(article);
      });
    }

    function renderProjects(projects) {
      const container = getElement("projectsContent");
      container.replaceChildren();

      projects.forEach(([title, description], index) => {
        const article = createElement("article", "panel project-card");

        article.append(
          createElement(
            "span",
            "project-number",
            String(index + 1).padStart(2, "0")
          ),
          createElement("h3", "", title),
          createElement("p", "", description)
        );

        container.appendChild(article);
      });
    }

    function renderEducation(entries) {
      const container = getElement("educationContent");
      container.replaceChildren();

      entries.forEach((entry) => {
        const article = createElement("article", "education-card");

        article.append(
          createElement("h3", "", entry.title),
          createElement("p", "organization", entry.organization),
          createElement("div", "date", entry.detail),
          createElement("p", "", entry.description)
        );

        container.appendChild(article);
      });
    }

    function renderSkills(groups) {
      const container = getElement("skillsContent");
      container.replaceChildren();

      groups.forEach(([title, ...skills]) => {
        const article = createElement("article", "panel");
        const tags = createElement("div", "skill-tags");

        article.appendChild(createElement("h3", "", title));

        skills.forEach((skill) => {
          tags.appendChild(createElement("span", "skill-tag", skill));
        });

        article.appendChild(tags);
        container.appendChild(article);
      });
    }

    function renderLanguages(languages) {
      const container = getElement("languagesContent");
      container.replaceChildren();

      languages.forEach(([language, level]) => {
        const article = createElement("div", "panel language-card");

        article.append(
          createElement("strong", "", language),
          createElement("span", "", level)
        );

        container.appendChild(article);
      });
    }

    function setLanguage(language) {
      const selectedLanguage =
        Object.prototype.hasOwnProperty.call(content, language)
          ? language
          : "de";

      const text = content[selectedLanguage];

      document.documentElement.lang =
        selectedLanguage === "zh" ? "zh-CN" : selectedLanguage;

      document.title = text.pageTitle;

      document
        .querySelector('meta[name="description"]')
        .setAttribute("content", text.introduction);

      const textFields = {
        eyebrow: text.eyebrow,
        role: text.role,
        tagline: text.tagline,
        introduction: text.introduction,
        location: text.location,
        experienceButton: text.experienceButton,
        educationButton: text.educationButton,
        aboutTitle: text.aboutTitle,
        experienceTitle: text.experienceTitle,
        experienceSubtitle: text.experienceSubtitle,
        projectsTitle: text.projectsTitle,
        projectsSubtitle: text.projectsSubtitle,
        educationTitle: text.educationTitle,
        skillsTitle: text.skillsTitle,
        languagesTitle: text.languagesTitle,
        contactTitle: text.contactTitle,
        contactContent: text.contact,
        contactNote: text.contactNote,
        footer: text.footer
      };

      Object.entries(textFields).forEach(([id, value]) => {
        getElement(id).textContent = value;
      });

      renderNavigation(text.navigation);
      renderAbout(text.about);
      renderExperience(text.jobs);
      renderProjects(text.projects);
      renderEducation(text.education);
      renderSkills(text.skills);
      renderLanguages(text.languages);

      document.querySelectorAll("[data-lang]").forEach((button) => {
        const active = button.dataset.lang === selectedLanguage;

        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      try {
        localStorage.setItem("xing-liu-language", selectedLanguage);
      } catch (error) {
        // The page also works when browser storage is unavailable.
      }
    }

    document.querySelectorAll("[data-lang]").forEach((button) => {
      button.addEventListener("click", () => {
        setLanguage(button.dataset.lang);
      });
    });

    let initialLanguage = "de";

    try {
      const savedLanguage = localStorage.getItem("xing-liu-language");

      if (
        savedLanguage &&
        Object.prototype.hasOwnProperty.call(content, savedLanguage)
      ) {
        initialLanguage = savedLanguage;
      }
    } catch (error) {
      // Use German as the default language.
    }

    setLanguage(initialLanguage);
  </script>
</body>
</html>
